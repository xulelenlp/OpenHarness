[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openharness-ai"
version = "0.1.9"
description = "Open-source Python port of Claude Code - an AI-powered CLI coding assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0,<2.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "slack-sdk>=3.0.0",
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.0.0",
    "lark-oapi>=1.5.0",
    "starlette>=0.36.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    # 文档解析与会话脚本执行：qaapp 上传 Word/Excel/TXT 时解析内容；
    # 生成到会话目录的临时脚本也可直接用 pandas/openpyxl 做数据分析。
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pandas>=2.0.0",
    # 业务库/Redis 取数与报告图表。
    "pymysql>=1.1.0",
    "redis>=5.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    # 测试用：生成 .xls 旧版 Excel 样本（解析侧用 xlrd，写入侧用 xlwt）。
    "xlwt>=1.3.0",
]

[project.scripts]
abc = "openharness.cli:app"
abcag = "ohmo.cli:app"
abcqa = "qaapp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openharness", "ohmo", "qaapp"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.openharness-venv",
    "/.openharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "openharness/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "openharness/_frontend/tsconfig.json"
"frontend/terminal/src" = "openharness/_frontend/src"
# Canonical config templates used by `abcqa init` when installed from a wheel.
"config/backend/agents.json" = "qaapp/_config/backend/agents.json"
"config/backend/dangerous-actions.json" = "qaapp/_config/backend/dangerous-actions.json"
"config/backend/datasources.json" = "qaapp/_config/backend/datasources.json"
"config/backend/webapp.json" = "qaapp/_config/backend/webapp.json"
"config/backend/.env_dev" = "qaapp/_config/backend/.env_dev"
"config/backend/.env_prod" = "qaapp/_config/backend/.env_prod"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_api: opt-in tests that call a real model provider (excluded by default)",
]
addopts = ["-m", "not real_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
